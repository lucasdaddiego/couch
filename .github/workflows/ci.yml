name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: node --test (the Board Worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # the tests import only node's own modules and src/: no npm ci, so wrangler never runs here.
      # The publishers' feeds and pages are not in the repo: their tests are skipped.
      - name: Tests (the reply's format, the cache and failure paths, the reader)
        working-directory: worker
        run: node --test test/*.test.js
